  const containerRef = React.useRef(null);

  const hoveredEvent = hovered ? SESSION.events.find(e => e.id === hovered.id) : null;

  return (
    <>

            {SESSION.events.length} events

        </div>
        {/* Scrubber bar with event ticks */}
        <div style={{ position: "relative", height: 14, display: "flex", alignItems: "center" }}>
          <div style={{ position: "absolute", left: 0, right: 0, top: "50%", height: 3, transform: "translateY(-50%)", background: "oklch(26% 0.012 250)", borderRadius: 2 }} />
          <div style={{ position: "absolute", left: 0, top: "50%", height: 3, transform: "translateY(-50%)", width: `${(playhead / SESSION.duration_s) * 100}%`, background: "var(--accent-red-mid)", borderRadius: 2 }} />
          {SESSION.events.map(ev => (
            <div key={ev.id}
              onMouseEnter={e => setHovered({ id: ev.id, top: e.currentTarget.getBoundingClientRect().top })}

              style={{ position: "absolute", left: `${(ev.t / SESSION.duration_s) * 100}%`, top: "50%", transform: "translate(-50%, -50%)", width: 5, height: 5, borderRadius: "50%", background: KIND_COLOR[ev.kind].dot, boxShadow: "0 0 0 1.5px var(--bg-sidebar)", cursor: "pointer" }} />

      {/* Event list */}
      <div ref={containerRef} style={{ flex: 1, minHeight: 0, overflow: "auto", padding: "0 4px 4px", position: "relative" }}>
        {SESSION.events.slice().reverse().map((ev, idx) => {
          const isHovered = hovered?.id === ev.id;
          return (
            <div key={ev.id}
              onMouseEnter={e => setHovered({ id: ev.id, top: e.currentTarget.getBoundingClientRect().top })}
              onMouseLeave={() => setHovered(null)}
              style={{
                display: "grid",
                gridTemplateColumns: "26px 14px 1fr",
                alignItems: "center",
                gap: 4,
                padding: "3px 6px",
                borderRadius: 4,
                cursor: "pointer",
                background: isHovered ? "oklch(26% 0.014 250)" : "transparent",
                position: "relative",

              <span style={{ fontFamily: "ui-monospace, 'SF Mono', Menlo, monospace", fontSize: 9.5, color: "oklch(52% 0.010 250)", textAlign: "right" }}>

              <span style={{ display: "flex", alignItems: "center", justifyContent: "center", color: KIND_COLOR[ev.kind].dot }}>
                <Icon name={ev.icon} size={10} />

                {ev.label}
              </span>
              {/* Connecting timeline rail on the left of the icon column */}
              {idx < SESSION.events.length - 1 && (
                <span aria-hidden="true" style={{ position: "absolute", left: 26 + 4 + 7, top: 17, width: 1, height: "calc(100% - 14px)", background: "oklch(26% 0.012 250)" }} />
              )}
            </div>
          );
        })}
      </div>

      {/* Snippet popout — fixed-positioned to escape sidebar overflow */}
      {hoveredEvent && containerRect && (
        <div
          style={{
            position: "fixed",
            left: containerRect.right + 10,
            top: Math.max(60, Math.min(window.innerHeight - 200, hovered.top - 4)),
            width: 280,
            background: "var(--bg-panel)",
            border: "1px solid var(--border)",
            borderRadius: 8,
            boxShadow: "var(--shadow-lg)",
            padding: "10px 12px",
            zIndex: 1000,
            pointerEvents: "none",
            fontFamily: "var(--font-ui)",
          }}
        >
          <div style={{ position: "absolute", left: -6, top: 12, width: 10, height: 10, background: "var(--bg-panel)", borderLeft: "1px solid var(--border)", borderBottom: "1px solid var(--border)", transform: "rotate(45deg)" }} />

          <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 6 }}>
            <span style={{ width: 6, height: 6, borderRadius: "50%", background: KIND_COLOR[hoveredEvent.kind].dot, flexShrink: 0 }} />

          <div style={{ fontSize: 13, color: "var(--text)", fontWeight: 500, lineHeight: 1.35, marginBottom: 5, fontFamily: "var(--font-serif)" }}>
            {hoveredEvent.label}
          </div>

    </>
  );
};

const SidebarPanel = () => {

        </button>

        {/* Collapse / show */}
        <button onClick={() => setOpen(o => !o)}

          onMouseEnter={e => { e.currentTarget.style.color = "var(--text-sidebar-active)"; e.currentTarget.style.background = "oklch(26% 0.014 250)"; }}

          <svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round">

              : <path d="M2 7l3.5-3.5L9 7" />}      {/* chevron up → expands */}
          </svg>

        {/* Selector menu */}

          <div onClick={(e) => e.stopPropagation()}

            <div style={{ fontSize: 9, color: "oklch(55% 0.010 250)", textTransform: "uppercase", letterSpacing: "0.08em", padding: "5px 8px 4px", fontWeight: 500 }}>Show in this slot</div>
            {Object.entries(PANELS).map(([key, p]) => (
              <button key={key}
                onClick={() => { setPanel(key); setMenuOpen(false); setOpen(true); }}
                style={{ display: "flex", alignItems: "center", gap: 8, width: "100%", padding: "6px 8px", border: "none", background: panel === key ? "oklch(28% 0.014 250)" : "transparent", color: panel === key ? "var(--text-sidebar-active)" : "var(--text-sidebar)", borderRadius: 4, fontSize: 11.5, cursor: "pointer", textAlign: "left", fontFamily: "var(--font-ui)" }}
                onMouseEnter={e => { if (panel !== key) e.currentTarget.style.background = "oklch(26% 0.014 250)"; }}
                onMouseLeave={e => { if (panel !== key) e.currentTarget.style.background = "transparent"; }}>
                <Icon name={p.icon} size={12} style={{ color: panel === key ? "var(--accent-red-mid)" : "oklch(60% 0.010 250)" }} />
                <span style={{ flex: 1 }}>{p.label}</span>

              </button>
            ))}
            <div style={{ height: 1, background: "oklch(28% 0.012 250)", margin: "4px 4px" }} />
            <button
              onClick={() => { setOpen(false); setMenuOpen(false); }}
              style={{ display: "flex", alignItems: "center", gap: 8, width: "100%", padding: "6px 8px", border: "none", background: "transparent", color: "var(--text-sidebar)", borderRadius: 4, fontSize: 11.5, cursor: "pointer", textAlign: "left", fontFamily: "var(--font-ui)" }}

              <span style={{ flex: 1 }}>Hide panel</span>

      {/* Body */}
      {open && <Comp />}
    </div>
  );
};

      <div style={{ display: "flex", gap: 8, alignItems: "center" }}>

const SourceThumbnail = ({ result }) => {

        width: 64,
        height: 86,

        borderRadius: 3,

        color: cfg.fg,
        boxShadow: "0 1px 2px oklch(0% 0 0 / 0.20), 0 4px 10px oklch(0% 0 0 / 0.10), inset -1px 0 0 oklch(0% 0 0 / 0.15), inset 1px 0 0 oklch(100% 0 0 / 0.06)",

        display: "flex",
        flexDirection: "column",
        padding: "6px 5px 5px",

      <div style={{ fontSize: titleAbbr.length > 18 ? 8 : 9.5, fontWeight: 500, lineHeight: 1.05, marginTop: 3, textWrap: "balance" }}>
        {titleAbbr}
      </div>

      {/* motif */}
      <div style={{ flex: 1, marginTop: 4, position: "relative", opacity: 0.55 }}>
        {cfg.motif === "grid" && (
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 1.5, height: "100%" }}>
            {Array.from({ length: 9 }).map((_, i) => (
              <div key={i} style={{ background: cfg.fg, opacity: 0.10 + (i % 3) * 0.08, borderRadius: 1 }} />

          </div>

        {cfg.motif === "bar" && (
          <div style={{ display: "flex", alignItems: "flex-end", gap: 1.5, height: "100%" }}>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", fontSize: 6, fontFamily: "var(--font-ui)", letterSpacing: "0.06em", opacity: 0.85, fontWeight: 500, marginTop: 3 }}>

const SearchProvenanceCard = ({ degraded }) => {
  const [open, setOpen] = React.useState(true);
  // The router sent this query to a single discipline bucket (Social Sciences),
  // and the default __recent persona pruned everything before 2010.
  const [searched, setSearched] = React.useState(() => new Set([provKey("Social Sciences", "2010–present")]));
  const [unpacking, setUnpacking] = React.useState(false);
  const [profileOpen, setProfileOpen] = React.useState(false);

  const total = PROV_SUBJECTS.length * PROV_ERAS.length; // 10
  const count = searched.size;
  const full = count === total;
  const isOn = (s, e) => searched.has(provKey(s, e));
  const eraPruned = PROV_SUBJECTS.some(s => isOn(s, "2010–present") && !isOn(s, "pre-2010"));
  const missingSubjects = PROV_SUBJECTS.filter(s => !isOn(s, "2010–present") && !isOn(s, "pre-2010"));

  const widen = () => {
    setUnpacking(true);
    setProfileOpen(false);
    setTimeout(() => {
      const all = new Set();
      PROV_SUBJECTS.forEach(s => PROV_ERAS.forEach(e => all.add(provKey(s, e))));
      setSearched(all);
      setUnpacking(false);
    }, 750);
  };
  const removeDate = () => setSearched(prev => {
    const n = new Set(prev);
    PROV_SUBJECTS.forEach(s => { if (n.has(provKey(s, "2010–present"))) n.add(provKey(s, "pre-2010")); });
    return n;
  });
  const addSubject = (s) => { setSearched(prev => new Set(prev).add(provKey(s, "2010–present"))); setProfileOpen(false); };

  const goAbout = () => { if (window.parent !== window) window.parent.postMessage({ suiteNav: "analytics" }, "*"); else window.location.href = "Research Analytics.html"; };

  const sev = degraded ? { color: "var(--accent-red)", bg: "var(--accent-red-light)" }
            : full ? { color: "var(--accent-teal)", bg: "var(--accent-teal-light)" }
            : { color: "oklch(52% 0.13 75)", bg: "var(--accent-amber-light)" };

  return (
    <div style={{ background: "var(--bg-panel)", border: "1px solid var(--border-light)", borderRadius: 10, marginBottom: 16, boxShadow: "var(--shadow-sm)", overflow: "hidden" }} data-comment-anchor="search-provenance">
      {/* Always-visible header — coverage at a glance */}
      <button onClick={() => setOpen(!open)} style={{ width: "100%", display: "flex", alignItems: "center", gap: 11, padding: "12px 16px", border: "none", background: "transparent", textAlign: "left" }}>
        <span style={{ width: 28, height: 28, borderRadius: 8, background: sev.bg, color: sev.color, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
          <Icon name={degraded ? "warning" : full ? "check" : "info"} size={16} />
        </span>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 13, color: "var(--text)", fontWeight: 600 }}>
            What this search covered
          </div>
          <div style={{ fontSize: 12, color: "var(--text-muted)", marginTop: 1 }}>
            Read <strong style={{ color: sev.color }}>{count} of {total}</strong> index sections
            {degraded ? " · 1 engine unavailable" : full ? " · full index" : " · partial coverage"}
          </div>
        </div>
        <span style={{ fontSize: 11, color: "var(--text-muted)", display: "flex", alignItems: "center", gap: 6, flexShrink: 0 }}>
          {open ? "Hide" : "Details"}
          <Icon name={open ? "chevronDown" : "chevronRight"} size={14} />
        </span>
      </button>

      {open && (
        <div style={{ padding: "0 16px 16px" }}>
          {/* Loud degraded banner */}
          {degraded && (
            <div style={{ display: "flex", gap: 10, padding: "11px 13px", background: "var(--accent-red-light)", borderRadius: 8, borderLeft: "3px solid var(--accent-red)", marginBottom: 4 }}>
              <Icon name="warning" size={15} style={{ color: "var(--accent-red)", flexShrink: 0, marginTop: 1 }} />
              <div style={{ fontSize: 12.5, color: "var(--text)", lineHeight: 1.5 }}>
                <strong style={{ fontWeight: 600 }}>The semantic-sparse engine (SPLADE) was unavailable for this query.</strong> Results came from keyword and dense matching only — a paper that matches your topic in meaning but not in exact wording may be missing. Re-run later for the full mix.
              </div>
            </div>
          )}

          {/* Engine mix jumps to the top when degraded */}
          {degraded && (
            <ProvRow tone="alert" icon="cpu" title="Which engines ran">
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 6, marginBottom: 6 }}>
                <EnginePill label="Keyword" ok={true} />
                <EnginePill label="Semantic-sparse (SPLADE)" ok={false} />
                <EnginePill label="Semantic-dense" ok={true} />
              </div>
              Results were fused from 2 of 3 engines with Reciprocal Rank Fusion (k = 60), which weights each engine equally.
            </ProvRow>
          )}

          {/* 1 · PARTIAL COVERAGE — the lead */}
          <ProvRow tone={full ? "ok" : "warn"} icon="server" title={full ? "Full index searched" : "Most of the index was not searched"}>
            {full
              ? "Every section was unpacked and searched, across all five disciplines and both eras. This is now a complete view of the index."
              : <>Your query was routed to a single section — <strong style={{ color: "var(--text)" }}>Social Sciences · 2010–present</strong>. The other {total - count} sections stayed in cold storage or were pruned by your date filter, including <strong style={{ color: "var(--text)" }}>Arts &amp; Humanities</strong>, where much of this literature sits, and everything published before 2010.</>}

            {/* Section grid */}
            <div style={{ marginTop: 12, display: "grid", gridTemplateColumns: "118px 1fr 1fr", gap: 5, alignItems: "center" }}>
              <span />
              {PROV_ERAS.map(e => <span key={e} style={{ fontSize: 10.5, color: "var(--text-muted)", textAlign: "center", letterSpacing: "0.03em" }}>{e}</span>)}
              {PROV_SUBJECTS.map(s => (
                <React.Fragment key={s}>
                  <span style={{ fontSize: 11.5, color: "var(--text-secondary)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{s}</span>
                  {PROV_ERAS.map(e => {
                    const on = isOn(s, e);
                    return (
                      <div key={e} style={{
                        height: 28, borderRadius: 5, display: "flex", alignItems: "center", justifyContent: "center", gap: 4,
                        fontSize: 10.5, fontWeight: 500,
                        background: on ? "var(--accent-teal-light)" : "var(--bg)",
                        border: on ? "1px solid var(--accent-teal)" : "1px dashed var(--border)",
                        color: on ? "var(--accent-teal)" : "var(--text-muted)",
                      }}>
                        {on ? <><Icon name="check" size={11} /> searched</> : "cold"}
                      </div>
                    );
                  })}
                </React.Fragment>
              ))}
            </div>

            {/* Affordances — each maps to a real retriever action */}
            {!full && (
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginTop: 13, position: "relative" }}>
                <ProvAction icon="server" onClick={widen} busy={unpacking}>
                  {unpacking ? "Unpacking sections…" : "Widen search — unpack cold sections"}
                </ProvAction>
                {eraPruned && (
                  <ProvAction icon="history" onClick={removeDate}>Remove date filter (pre-2010)</ProvAction>
                )}
                {missingSubjects.length > 0 && (
                  <div style={{ position: "relative" }}>
                    <ProvAction icon="filter" onClick={() => setProfileOpen(o => !o)}>Switch subject profile</ProvAction>
                    {profileOpen && (
                      <div style={{ position: "absolute", top: "calc(100% + 4px)", left: 0, zIndex: 5, background: "var(--bg-panel)", border: "1px solid var(--border)", borderRadius: 8, boxShadow: "var(--shadow-md)", padding: 4, minWidth: 180 }}>
                        {missingSubjects.map(s => (
                          <button key={s} onClick={() => addSubject(s)} style={{ display: "block", width: "100%", textAlign: "left", padding: "7px 10px", border: "none", background: "transparent", borderRadius: 5, fontSize: 12.5, color: "var(--text)" }}
                            onMouseEnter={e => e.currentTarget.style.background = "var(--bg)"}
                            onMouseLeave={e => e.currentTarget.style.background = "transparent"}>
                            Add {s}
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}
          </ProvRow>

          {/* 2 · LANGUAGE / ENGLISH BIAS */}
          <ProvRow tone="warn" icon="info" title="Tuned for English">
            Matching favours English. Scholarship written in other languages — including Indigenous-language and non-English-venue work — ranks lower or is missed entirely, because the semantic model and the section vocabularies are English-only.
          </ProvRow>

          {/* 3 · RECENCY / ERA DEFAULT */}
          <ProvRow tone="warn" icon="history" title="Recent work is favoured by default">
            Your profile defaults to recent material (2010 onward) and the ranker adds a small recency boost. Foundational and historical work is under-represented unless you remove the date filter above.
          </ProvRow>

          {/* 4 · ENGINE MIX (healthy) */}
          {!degraded && (
            <ProvRow tone="ok" icon="cpu" title="Which engines ran">
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 6, marginBottom: 6 }}>
                <EnginePill label="Keyword" ok={true} />
                <EnginePill label="Semantic-sparse (SPLADE)" ok={true} />
                <EnginePill label="Semantic-dense" ok={true} />
              </div>
              All three engines ran and were fused with Reciprocal Rank Fusion (k = 60), which weights each engine equally — a result strong in only one method can be pushed down by the others.
            </ProvRow>
          )}

          {/* 5 · OA / ABSTRACT SKEW */}
          <ProvRow tone="neutral" icon="book" title="Open access & missing abstracts">
            About <strong style={{ color: "var(--text)" }}>38%</strong> of these results are open access. A handful were missing abstracts (the source metadata failed to load) and may rank lower, since the ranker rewards records with complete text to judge.
          </ProvRow>

          {/* 6 · EXACT WORDING */}
          <ProvRow tone="neutral" icon="search" title="Keyword matching is literal">
            The keyword engine does not match word variants or spellings on its own — "labour" ≠ "labor", "fisheries" ≠ "fishing". If results look thin, try alternate forms and spellings.
          </ProvRow>

          {/* 7 · QUANTIZATION — de-emphasized footnote */}
          <ProvRow tone="neutral" icon="cpu" title="Speed trade-offs" muted={true}>
            For speed, very long queries are compressed to their most important terms and a small number of borderline matches may be dropped. Measured impact on recall is minor.
          </ProvRow>

          {/* Footer */}
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, flexWrap: "wrap", marginTop: 14, paddingTop: 12, borderTop: "1px solid var(--border-light)" }}>
            <span style={{ fontSize: 11, color: "var(--text-muted)", fontFamily: "var(--font-ui)" }}>
              Fields from <code style={{ fontFamily: "ui-monospace, monospace", fontSize: 10.5, background: "var(--bg)", padding: "1px 5px", borderRadius: 3, border: "1px solid var(--border-light)" }}>get_search_provenance</code> · index of 150,413,098 documents

              About this index <Icon name="chevronRight" size={13} />
            </button>
          </div>
        </div>
      )}
    </div>
  );
};

const SearchScreen = ({ savedIds, toggleSave, degraded, setAiStatus }) => {
  const [query, setQuery] = React.useState("");
  const [filters, setFilters] = React.useState({ type: "All", date: "Any time", access: "Any", sort: "Relevance" });
  const [results, setResults] = React.useState([]);
  const [loading, setLoading] = React.useState(false);
  const [searched, setSearched] = React.useState(false);
  const [selected, setSelected] = React.useState(null);
  const [usingMock, setUsingMock] = React.useState(false);

  // Live search via SFUApi; transparently falls back to sample data when the
  // backend is unreachable, and raises the shared demo-data banner so the user
  // always knows when results aren't live.
  const doSearch = async () => {
    if (!query.trim()) return;
    setLoading(true);
    setSelected(null);
    try {
      const res = await window.SFUApi.search(query, filters);
      const liveHasResults = res.source === "live" && res.results && res.results.length > 0;
      // We display sample data when the backend is down OR when it returned
      // nothing (e.g. a degraded leg). Either way the user must be told.
      const showingMock = !liveHasResults;
      const list = liveHasResults ? res.results : (window.SFUMock.results || []);
      setResults(list);
      setUsingMock(showingMock);
      if (window.SFUUI) {
        let msg;
        if (showingMock && res.source === "live") {
          msg = "Live backend returned no results — showing sample data."
              + ((res.notes && res.notes.length) ? " " + res.notes[0] : "");
        }
        window.SFUUI.setMockBanner(showingMock, msg);
      }
      // AI/backend status tracks reachability, not whether we showed samples.
      if (setAiStatus) setAiStatus(res.source === "live" ? "online" : "offline");
    } catch (e) {
      setResults(window.SFUMock.results || []);
      setUsingMock(true);
      if (window.SFUUI) window.SFUUI.setMockBanner(true);
      if (setAiStatus) setAiStatus("offline");
    } finally {
      setLoading(false);
      setSearched(true);
    }
  };

  // Landing state
  if (!searched) {
    return (
      <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "0 60px 60px" }}>
        <div style={{ marginBottom: 32, textAlign: "center" }}>
          <div style={{ width: 52, height: 52, borderRadius: 14, background: "var(--accent-red)", display: "inline-flex", alignItems: "center", justifyContent: "center", marginBottom: 16 }}>
            <Icon name="search" size={22} style={{ color: "white" }} />
          </div>
          <h1 style={{ fontSize: 26, fontFamily: "var(--font-serif)", fontWeight: 500, color: "var(--text)", marginBottom: 8 }}>Research begins here.</h1>
          <p style={{ fontSize: 14, color: "var(--text-muted)", maxWidth: 400, lineHeight: 1.6 }}>Search 250M+ scholarly works with AI-powered query understanding and SFU library access resolution.</p>
        </div>
        <div style={{ width: "100%", maxWidth: 600 }}>
          <SearchBar query={query} setQuery={setQuery} onSearch={doSearch} loading={loading} filters={filters} setFilters={setFilters} />
        </div>
        {/* Example queries */}
        <div style={{ marginTop: 24, display: "flex", flexWrap: "wrap", gap: 8, justifyContent: "center", maxWidth: 580 }}>
          <span style={{ fontSize: 12, color: "var(--text-muted)", width: "100%", textAlign: "center", marginBottom: 4 }}>Try:</span>
          {["indigenous knowledge systems in climate adaptation", "recent ML papers for drug discovery", "CRISPR gene editing in salmon, open access", "climate change BC fisheries 2020–2025"].map(ex => (
            <button key={ex} onClick={() => { setQuery(ex); }} style={{ fontSize: 12, padding: "6px 12px", background: "var(--bg-panel)", border: "1px solid var(--border)", borderRadius: 16, color: "var(--text-secondary)", cursor: "pointer", fontFamily: "var(--font-ui)", transition: "border-color 0.15s, color 0.15s" }}
              onMouseEnter={e => { e.currentTarget.style.borderColor = "var(--accent-red)"; e.currentTarget.style.color = "var(--accent-red)"; }}
              onMouseLeave={e => { e.currentTarget.style.borderColor = "var(--border)"; e.currentTarget.style.color = "var(--text-secondary)"; }}>
              {ex}
            </button>
          ))}
        </div>
      </div>
    );
  }

  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column", minHeight: 0 }}>
      {/* Search bar header */}
      <div style={{ padding: "14px 20px 12px", borderBottom: "1px solid var(--border-light)", background: "var(--bg-panel)" }}>
        <SearchBar query={query} setQuery={setQuery} onSearch={doSearch} loading={loading} filters={filters} setFilters={setFilters} compact />
      </div>

      {/* Results area */}
      <div style={{ flex: 1, display: "flex", minHeight: 0 }}>
        {/* Results list */}
        <div style={{ flex: 1, overflow: "auto", padding: "16px 20px" }}>
          {loading ? (
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              <div style={{ fontSize: 13, color: "var(--text-muted)", marginBottom: 8, display: "flex", alignItems: "center", gap: 8 }}>
                <div style={{ width: 14, height: 14, border: "2px solid var(--accent-red-light)", borderTopColor: "var(--accent-red)", borderRadius: "50%", animation: "spin 0.7s linear infinite" }} />
                Searching OpenAlex · Resolving SFU access…
              </div>
              {[1, 2, 3].map(i => (
                <div key={i} style={{ background: "var(--bg-panel)", border: "1px solid var(--border-light)", borderRadius: 10, padding: "16px 18px", height: 110 }}>
                  <div style={{ height: 14, background: "var(--border)", borderRadius: 3, width: "75%", marginBottom: 8, animation: "pulse 1.4s ease infinite" }} />
                  <div style={{ height: 10, background: "var(--border)", borderRadius: 3, width: "50%", marginBottom: 10, animation: "pulse 1.4s ease infinite" }} />
                  <div style={{ height: 10, background: "var(--border)", borderRadius: 3, width: "90%", animation: "pulse 1.4s ease infinite" }} />
                </div>
              ))}
            </div>
          ) : (
            <>
              <SearchProvenanceCard degraded={degraded} />
              <AIInterpretationBox query={query} />
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
                <span style={{ fontSize: 12.5, color: "var(--text-muted)" }}>
                  <strong style={{ color: "var(--text)", fontWeight: 600 }}>{results.length}</strong> results for <em>"{query}"</em>
                </span>
              </div>
              {results.map((r, i) => (
                <ResultCard key={r.id} result={r} index={i + 1} onClick={setSelected} saved={savedIds.has(r.id)} onSave={toggleSave} />
              ))}
            </>
          )}
        </div>

        {/* Detail panel */}
        {selected && (
          <ResultDetail result={selected} onClose={() => setSelected(null)} saved={savedIds.has(selected.id)} onSave={toggleSave} />
        )}
      </div>
    </div>
  );
};

const SavedScreen = ({ savedIds, toggleSave }) => {

  const saved = Array.from(savedIds).map(id => pool[id]).filter(Boolean);

  );
};

const SessionTimeline = ({ session }) => {
  const [playhead, setPlayhead] = React.useState(session.duration_s);
  const [playing, setPlaying] = React.useState(false);
  const [selected, setSelected] = React.useState(null);

  // Reset whenever the session changes.
  React.useEffect(() => { setPlayhead(session.duration_s); setPlaying(false); setSelected(null); }, [session.id]);

  React.useEffect(() => {
    if (!playing) return;
    const iv = setInterval(() => {
      setPlayhead(p => {
        if (p >= session.duration_s) { setPlaying(false); return session.duration_s; }
        return p + 1;
      });
    }, 90);
    return () => clearInterval(iv);
  }, [playing, session.duration_s]);

  const play = () => {
    if (playhead >= session.duration_s) setPlayhead(0);
    setPlaying(p => !p);
  };

  const stats = [
    { label: "Duration", value: `00:${String(session.duration_s).padStart(2, "0")}` },
    { label: "Events", value: session.events.length },
    { label: "Opened", value: session.opened },
    { label: "Saved", value: session.saved },
    { label: "Refinements", value: session.refined },
  ];

  return (
    <div style={{ display: "flex", flexDirection: "column", minHeight: 0, height: "100%" }}>
      {/* Header */}
      <div style={{ padding: "20px 24px 16px", borderBottom: "1px solid var(--border-light)" }}>
        <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 16, flexWrap: "wrap" }}>
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 11, fontWeight: 500, letterSpacing: "0.07em", textTransform: "uppercase", color: "var(--text-muted)", marginBottom: 6 }}>Session replay</div>
            <h3 style={{ fontFamily: "var(--font-serif)", fontSize: 20, fontWeight: 500, color: "var(--text)", lineHeight: 1.25 }}>"{session.q}"</h3>
            <div style={{ fontSize: 12, color: "var(--text-muted)", marginTop: 4 }}>{session.time} · {session.results} results</div>
          </div>
          <button style={{ display: "inline-flex", alignItems: "center", gap: 6, padding: "7px 12px", border: "1px solid var(--border)", borderRadius: 7, background: "var(--bg-panel)", fontSize: 12.5, color: "var(--text-secondary)", flexShrink: 0 }}>
            <Icon name="search" size={13} /> Resume in Search
          </button>
        </div>
        {/* Stat chips */}
        <div style={{ display: "flex", gap: 18, marginTop: 14, flexWrap: "wrap" }}>
          {stats.map(s => (
            <div key={s.label}>
              <div style={{ fontFamily: "var(--font-serif)", fontSize: 18, fontWeight: 500, color: "var(--text)", lineHeight: 1 }}>{s.value}</div>
              <div style={{ fontSize: 10.5, color: "var(--text-muted)", letterSpacing: "0.05em", textTransform: "uppercase", marginTop: 3 }}>{s.label}</div>
            </div>
          ))}
        </div>
        {/* Scrubber */}
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 16 }}>
          <button onClick={play} style={{ width: 28, height: 28, borderRadius: "50%", background: "var(--accent-red)", border: "none", color: "white", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
            {playing
              ? <svg width="9" height="10" viewBox="0 0 9 10" fill="currentColor"><rect x="0" y="0" width="3" height="10" rx="1"/><rect x="6" y="0" width="3" height="10" rx="1"/></svg>
              : <svg width="9" height="10" viewBox="0 0 9 10" fill="currentColor"><path d="M0 0v10l9-5L0 0Z"/></svg>}
          </button>
          <span style={{ fontFamily: "var(--font-mono)", fontSize: 11.5, color: "var(--text-secondary)" }}>00:{String(playhead).padStart(2, "0")}</span>
          <div style={{ position: "relative", flex: 1, height: 16, display: "flex", alignItems: "center" }}>
            <div style={{ position: "absolute", left: 0, right: 0, height: 4, background: "var(--bg-soft, var(--border-light))", borderRadius: 2 }} />
            <div style={{ position: "absolute", left: 0, height: 4, width: `${(playhead / session.duration_s) * 100}%`, background: "var(--accent-red-mid)", borderRadius: 2 }} />
            {session.events.map(ev => (
              <div key={ev.id} onClick={() => { setPlayhead(ev.t); setSelected(ev.id); }} title={ev.label}
                style={{ position: "absolute", left: `${(ev.t / session.duration_s) * 100}%`, transform: "translateX(-50%)", width: 7, height: 7, borderRadius: "50%", background: KIND_COLOR[ev.kind].dot, boxShadow: "0 0 0 2px var(--bg-panel)", cursor: "pointer" }} />
            ))}
          </div>
          <span style={{ fontFamily: "var(--font-mono)", fontSize: 11.5, color: "var(--text-muted)" }}>00:{String(session.duration_s).padStart(2, "0")}</span>
        </div>
      </div>

      {/* Timeline */}
      <div style={{ flex: 1, overflow: "auto", padding: "20px 24px 28px" }}>
        <div style={{ position: "relative" }}>
          {/* Rail */}
          <div style={{ position: "absolute", left: 51, top: 8, bottom: 8, width: 2, background: "var(--border-light)" }} />
          <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
            {session.events.map(ev => {
              const reached = ev.t <= playhead;
              const kc = KIND_COLOR[ev.kind];
              const isSel = selected === ev.id;
              return (
                <button key={ev.id} onClick={() => setSelected(isSel ? null : ev.id)}
                  style={{ display: "grid", gridTemplateColumns: "38px 26px 1fr", alignItems: "flex-start", gap: 8, padding: "8px 10px", borderRadius: 8, border: "1px solid " + (isSel ? "var(--border)" : "transparent"), background: isSel ? "var(--bg-panel)" : "transparent", textAlign: "left", opacity: reached ? 1 : 0.4, transition: "opacity 0.15s", cursor: "pointer", position: "relative" }}>
                  <span style={{ fontFamily: "var(--font-mono)", fontSize: 10.5, color: "var(--text-muted)", textAlign: "right", paddingTop: 5 }}>+{ev.t}s</span>
                  <span style={{ width: 26, height: 26, borderRadius: "50%", background: reached ? kc.dot : "var(--border)", color: "white", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1, boxShadow: "0 0 0 3px var(--bg)" }}>
                    <Icon name={ev.icon} size={13} />
                  </span>
                  <span style={{ paddingTop: 1, minWidth: 0 }}>
                    <span style={{ fontSize: 13, fontWeight: 500, color: "var(--text)", display: "block" }}>{ev.label}</span>
                    <span style={{ fontSize: 12, color: "var(--text-secondary)", lineHeight: 1.5, display: "block", marginTop: 2 }}>{ev.detail}</span>
                    <span style={{ fontSize: 10, color: kc.lane, fontWeight: 500, letterSpacing: "0.05em", textTransform: "uppercase", marginTop: 4, display: "inline-block" }}>{ev.kind}</span>
                  </span>
                </button>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
};

  const [screen, setScreen] = React.useState("search");
  const [savedIds, setSavedIds] = React.useState(new Set());
  // AI/backend status: probed live on mount and updated by each search. "online"
  // means the live search backend answered; "offline" means we're on fallback.
  const [aiStatus, setAiStatus] = React.useState("online");

  // Probe backend reachability on mount so the sidebar status + demo banner are
  // accurate before the first search.
  React.useEffect(() => {
    let cancelled = false;
    if (window.SFUApi) {
      window.SFUApi.health().then((r) => {
        if (cancelled) return;
        const online = r.source === "live";
        setAiStatus(online ? "online" : "offline");
        if (window.SFUUI) window.SFUUI.setMockBanner(!online);
      });
    }
    return () => { cancelled = true; };
  }, []);

  // Shell handshake: announce readiness, then accept screen requests so that
  // selecting a Search sub-screen (Saved / History / …) from another app lands
  // on the right screen here.
  React.useEffect(() => {
    const onMsg = (e) => {
      if (e.data && typeof e.data.suiteScreen === "string") setScreen(e.data.suiteScreen);
    };
    window.addEventListener("message", onMsg);
    if (window.parent !== window) window.parent.postMessage({ suiteReady: "search" }, "*");
    return () => window.removeEventListener("message", onMsg);
  }, []);

  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "accentColor": "teal",
    "density": "comfortable",
    "showTLDR": true,
    "aiInterpretation": true,
    "degradedRun": false
  }/*EDITMODE-END*/;

  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const toggleSave = (id) => {
    setSavedIds(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  };

  const accentMap = {
    red: { main: "oklch(52% 0.18 25)", light: "oklch(94% 0.04 25)", mid: "oklch(70% 0.10 25)" },
    blue: { main: "oklch(50% 0.18 255)", light: "oklch(94% 0.04 255)", mid: "oklch(70% 0.10 255)" },
    teal: { main: "oklch(50% 0.16 195)", light: "oklch(94% 0.04 195)", mid: "oklch(70% 0.10 195)" },
  };
  const accent = accentMap[tweaks.accentColor] || accentMap.red;

  return (
    <>
      <style>{`
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        :root {
          --accent-red: ${accent.main};
          --accent-red-light: ${accent.light};
          --accent-red-mid: ${accent.mid};
          --spacing-card: ${tweaks.density === "compact" ? "10px 14px" : "16px 18px"};
        }
      `}</style>
      <div style={{ display: "flex", height: "100vh", overflow: "hidden" }}>
        <Sidebar screen={screen} setScreen={setScreen} aiStatus={aiStatus} />
        <main style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0, overflow: "hidden" }}>
          {screen === "search" && <SearchScreen savedIds={savedIds} toggleSave={toggleSave} degraded={tweaks.degradedRun} setAiStatus={setAiStatus} />}
          {screen === "saved" && <SavedScreen savedIds={savedIds} toggleSave={toggleSave} />}
          {screen === "history" && <HistoryScreen />}
          {screen === "databases" && <DatabasesScreen />}
          {screen === "settings" && <SettingsScreen />}
          {screen === "admin" && <AdminScreen />}
        </main>
      </div>
      <TweaksPanel>
        <TweakSection label="Appearance" />
        <TweakRadio label="Accent Color" value={tweaks.accentColor} options={["red","blue","teal"]} onChange={v => setTweak("accentColor", v)} />
        <TweakRadio label="Density" value={tweaks.density} options={["comfortable","compact"]} onChange={v => setTweak("density", v)} />
        <TweakSection label="Results" />
        <TweakToggle label="Show TLDR summaries" value={tweaks.showTLDR} onChange={v => setTweak("showTLDR", v)} />
        <TweakToggle label="Show AI interpretation" value={tweaks.aiInterpretation} onChange={v => setTweak("aiInterpretation", v)} />
        <TweakSection label="Provenance" />
        <TweakToggle label="Simulate degraded run (SPLADE down)" value={tweaks.degradedRun} onChange={v => setTweak("degradedRun", v)} />
      </TweaksPanel>
    </>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
