// ─── SIDEBAR ───────────────────────────────────────────────────────────
const Sidebar = ({ active }) => {
  const top = [
    { id: "search", icon: "search", label: "Search" },
    { id: "saved", icon: "bookmark", label: "Saved" },
    { id: "history", icon: "history", label: "History" },
    { id: "databases", icon: "database", label: "Databases" },
    { id: "analytics", icon: "info", label: "About index" },
    { id: "index", icon: "server", label: "Index" },
  ];
  const bot = [
    { id: "settings", icon: "settings", label: "Settings" },
    { id: "admin", icon: "admin", label: "Admin" },
  ];
  const go = (id) => {
    if (id === active) return;
    if (window.parent !== window) window.parent.postMessage({ suiteNav: id }, "*");
  };
  const Item = ({ item }) => (
    <button onClick={() => go(item.id)}
      onMouseEnter={e => { if (active !== item.id) e.currentTarget.style.background = "var(--bg-sidebar-hover)"; }}
      onMouseLeave={e => { if (active !== item.id) e.currentTarget.style.background = "transparent"; }}
      style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 10px", borderRadius: 6, border: "none", cursor: "pointer", transition: "background 0.15s",
        background: active === item.id ? "var(--bg-sidebar-active)" : "transparent",
        color: active === item.id ? "var(--text-sidebar-active)" : "var(--text-sidebar)",
        fontSize: 13, fontWeight: active === item.id ? 500 : 400, textAlign: "left", width: "100%" }}>
      <Icon name={item.icon} size={15} />
      {item.label}
    </button>
  );
  return (
    <aside style={{ width: "var(--sidebar-width)", background: "var(--bg-sidebar)", display: "flex", flexDirection: "column", height: "100%", flexShrink: 0, position: "sticky", top: 0 }}>
      <div style={{ padding: "20px 18px 16px", borderBottom: "1px solid oklch(28% 0.010 250)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
          <div style={{ width: 28, height: 28, borderRadius: 6, background: "var(--c-red)", display: "flex", alignItems: "center", justifyContent: "center" }}>
            <Icon name="search" size={14} style={{ color: "white" }} />
          </div>
          <div>
            <div style={{ color: "var(--text-sidebar-active)", fontSize: 13, fontWeight: 600, lineHeight: 1.2 }}>SFU Library</div>
            <div style={{ color: "oklch(55% 0.010 250)", fontSize: 11, lineHeight: 1.2 }}>Academic Search</div>
          </div>
        </div>
      </div>
      <nav style={{ flex: 1, padding: "10px 8px", display: "flex", flexDirection: "column", gap: 2 }}>
        {top.map(i => <Item key={i.id} item={i} />)}
      </nav>
      <div style={{ padding: 8, borderTop: "1px solid oklch(28% 0.010 250)", display: "flex", flexDirection: "column", gap: 2 }}>
        {bot.map(i => <Item key={i.id} item={i} />)}

};

const DisclosureCard = ({ d, n }) => {
  const tones = {
    warn: { bar: "var(--c-amber)", ic: "var(--c-amber-ink)", icbg: "var(--c-amber-soft)" },
    good: { bar: "var(--c-green)", ic: "oklch(42% 0.10 145)", icbg: "var(--c-green-soft)" },
  };
  const t = tones[d.tone];
  return (
    <section style={{ background: "var(--bg-panel)", border: "1px solid var(--border-light)", borderLeft: `3px solid ${t.bar}`, borderRadius: "var(--radius-lg)", padding: "24px 28px", display: "flex", gap: 18, boxShadow: "var(--shadow-sm)" }}>
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 8, flexShrink: 0 }}>
        <span style={{ width: 38, height: 38, borderRadius: 10, background: t.icbg, color: t.ic, display: "flex", alignItems: "center", justifyContent: "center" }}>
          <Icon name={d.icon} size={19} />
        </span>
        <span style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--text-faint)" }}>{String(n).padStart(2, "0")}</span>
      </div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <h3 style={{ fontFamily: "var(--font-serif)", fontSize: 18, fontWeight: 500, color: "var(--text)", marginBottom: 8, display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
          {d.title}
          {d.positive && <span style={{ fontSize: 10.5, fontWeight: 500, letterSpacing: "0.06em", textTransform: "uppercase", padding: "2px 8px", borderRadius: 4, background: "var(--c-green-soft)", color: "oklch(42% 0.10 145)" }}>By design</span>}
        </h3>
        <p style={{ fontSize: 13.5, color: "var(--text-secondary)", lineHeight: 1.6, marginBottom: 12, maxWidth: "70ch" }}>{d.what}</p>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }} className="disc-grid">
          <div style={{ padding: "11px 14px", background: "var(--bg-soft)", borderRadius: 8 }}>
            <div style={{ fontSize: 10.5, fontWeight: 600, letterSpacing: "0.07em", textTransform: "uppercase", color: "var(--text-muted)", marginBottom: 4 }}>Why it matters</div>
            <p style={{ fontSize: 12.5, color: "var(--text-secondary)", lineHeight: 1.55 }}>{d.matters}</p>
          </div>
          {d.todo && (
            <div style={{ padding: "11px 14px", background: "var(--c-teal-soft)", borderRadius: 8 }}>
              <div style={{ fontSize: 10.5, fontWeight: 600, letterSpacing: "0.07em", textTransform: "uppercase", color: "oklch(40% 0.10 200)", marginBottom: 4 }}>What to do</div>
              <p style={{ fontSize: 12.5, color: "oklch(34% 0.07 200)", lineHeight: 1.55 }}>{d.todo}</p>
            </div>
          )}
        </div>
      </div>
    </section>
  );
};

const DisciplineBars = () => {
  const max = Math.max(...DISCIPLINES.map(d => d.v));
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 11 }}>
      {DISCIPLINES.map(d => (
        <div key={d.name} style={{ display: "grid", gridTemplateColumns: "132px 1fr 52px", alignItems: "center", gap: 12 }}>

          <div style={{ height: 14, background: "var(--bg-soft)", borderRadius: 4, overflow: "hidden" }}>
            <div style={{ width: `${(d.v / max) * 100}%`, height: "100%", background: d.color, borderRadius: 4 }} />

          <span style={{ fontFamily: "var(--font-mono)", fontSize: 11.5, color: "var(--text-secondary)", textAlign: "right" }}>{d.v}M</span>

};

        <div key={r.name} title={`${r.name}: ${r.pct}%`} style={{ width: `${r.pct}%`, background: r.color || "var(--c-teal)", display: "flex", alignItems: "center", justifyContent: "center" }}>

    <div style={{ display: "flex", flexDirection: "column", gap: 7 }}>
      {rows.map(r => (
        <div key={r.name} style={{ display: "flex", alignItems: "center", gap: 9, fontSize: 12.5 }}>

  { leg: "Semantic-dense", ms: 61, color: "var(--c-violet)" },

];

const OperatorSection = ({ metrics = OP_METRICS, latency = LEG_LATENCY }) => {
  const [open, setOpen] = React.useState(false);
  const maxMs = Math.max(...latency.map(l => l.ms));
  return (
    <section style={{ background: "var(--bg-panel)", border: "1px solid var(--border-light)", borderRadius: "var(--radius-lg)", boxShadow: "var(--shadow-sm)", overflow: "hidden" }}>

        <span style={{ width: 32, height: 32, borderRadius: 8, background: "var(--bg-soft)", color: "var(--text-secondary)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
          <Icon name="wrench" size={16} />
        </span>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 14, fontWeight: 600, color: "var(--text)" }}>Operator &amp; methodology</div>
          <div style={{ fontSize: 12, color: "var(--text-muted)", marginTop: 1 }}>Measured-quality metrics and per-engine timing — for people maintaining or auditing the system.</div>
        </div>
        <Icon name={open ? "chevronDown" : "chevronRight"} size={16} style={{ color: "var(--text-muted)" }} />
      </button>
      {open && (
        <div style={{ padding: "4px 26px 26px" }}>
          <div style={{ display: "flex", gap: 10, padding: "11px 14px", background: "var(--c-amber-soft)", borderRadius: 8, marginBottom: 20 }}>
            <Icon name="info" size={15} style={{ color: "var(--c-amber-ink)", flexShrink: 0, marginTop: 1 }} />
            <p style={{ fontSize: 12.5, color: "var(--text-secondary)", lineHeight: 1.55 }}>
              These are engineering measurements, not a quality guarantee. A single NDCG figure says how well the ranker reproduced a labelled test set — it does <strong>not</strong> certify that any given search was complete or unbiased. The disclosures above are the honest answer to that question.
            </p>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12, marginBottom: 22 }} className="op-grid">
            {metrics.map(m => (
              <div key={m.label} style={{ padding: "14px 16px", background: "var(--bg-soft)", borderRadius: 10 }}>
                <div style={{ fontSize: 10.5, fontWeight: 600, letterSpacing: "0.07em", textTransform: "uppercase", color: "var(--text-muted)", marginBottom: 6 }}>{m.label}</div>
                <div style={{ fontFamily: "var(--font-serif)", fontSize: 26, fontWeight: 500, color: "var(--text)", lineHeight: 1 }}>{m.value}</div>
                <div style={{ fontSize: 11, color: "var(--text-muted)", marginTop: 5 }}>{m.note}</div>
              </div>
            ))}
          </div>
          <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: "0.07em", textTransform: "uppercase", color: "var(--text-muted)", marginBottom: 12 }}>Per-engine latency · median ms</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {latency.map(l => (
              <div key={l.leg} style={{ display: "grid", gridTemplateColumns: "190px 1fr 44px", alignItems: "center", gap: 12 }}>
                <span style={{ fontSize: 12.5, color: "var(--text)" }}>{l.leg}</span>
                <div style={{ height: 12, background: "var(--bg-soft)", borderRadius: 4, overflow: "hidden" }}>
                  <div style={{ width: `${(l.ms / maxMs) * 100}%`, height: "100%", background: l.color, borderRadius: 4 }} />
                </div>
                <span style={{ fontFamily: "var(--font-mono)", fontSize: 11.5, color: "var(--text-secondary)", textAlign: "right" }}>{l.ms}</span>
              </div>
            ))}
          </div>
          <p style={{ fontSize: 12, color: "var(--text-muted)", lineHeight: 1.6, marginTop: 20, maxWidth: "78ch" }}>
            Three retrieval legs run in parallel and are combined with Reciprocal Rank Fusion (k = 60). The dense leg is a 600k-vector seed plus a warm-cache delta against the full {TOTAL_DOCS.toLocaleString()}-document corpus, so semantic coverage is query-driven, not exhaustive. SPLADE keeps the top 64 query terms; impact weights are 8-bit quantized. Index split at era boundary 2010, 5 subjects × 2 eras = 10 sections.
          </p>
        </div>
      )}
    </section>
  );
};

// ─── PAGE ──────────────────────────────────────────────────────────────
const FACTS = [
  { label: "Documents", value: TOTAL_DOCS.toLocaleString() },
  { label: "Source", value: "OpenAlex", sub: "June 2026 snapshot" },
  { label: "Sections", value: "10", sub: "5 subjects × 2 eras" },
  { label: "Era boundary", value: "2010", sub: "recent vs historical" },
];

// Merge the live /analytics bundle over the static prototype constants. Falls
// back to the constants on any panel that's stubbed/awaiting data.
function deriveLive(bundle) {
  const panels = (bundle && bundle.panels) || {};
  const kpis = panels.kpis || {};
  const ndcg = panels.ndcg_by_subject || {};
  const facts = FACTS.map(f => {
    if (f.label === "Documents" && kpis.documents) return { ...f, value: Number(kpis.documents).toLocaleString() };
    if (f.label === "Source" && kpis.snapshot) return { ...f, sub: kpis.snapshot };
    return f;
  });
  let metrics = OP_METRICS;
  if (ndcg.status === "ok" && Array.isArray(ndcg.subjects) && ndcg.subjects.length) {
    const mean = ndcg.subjects.reduce((a, s) => a + (s.ndcg || 0), 0) / ndcg.subjects.length;
    metrics = OP_METRICS.map(m => m.label === "NDCG@10" ? { ...m, value: mean.toFixed(3) } : m);
  }
  return { facts, metrics };
}

const App = () => {
  const [{ facts, metrics }, setLive] = React.useState({ facts: FACTS, metrics: OP_METRICS });
  React.useEffect(() => {
    let cancelled = false;
    if (window.SFUApi) {
      window.SFUApi.analytics().then(res => {
        if (cancelled) return;
        if (window.SFUUI) window.SFUUI.setMockBanner(res.source === "mock");
        if (res.source === "live") setLive(deriveLive(res.data));
      });
    }
    return () => { cancelled = true; };
  }, []);
  const goSearch = () => { if (window.parent !== window) window.parent.postMessage({ suiteNav: "search" }, "*"); else window.location.href = "search.html"; };
  return (
    <div style={{ display: "flex", height: "100%", minHeight: "100vh" }} data-screen-label="About this index">
      <Sidebar active="analytics" />
      <main style={{ flex: 1, overflow: "auto", display: "flex", flexDirection: "column" }}>
        {/* Header */}
        <header style={{ padding: "32px 48px 28px", borderBottom: "1px solid var(--border-light)", background: "var(--bg-panel)" }}>
          <div style={{ fontSize: 11.5, fontWeight: 500, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--text-muted)", marginBottom: 8 }}>About this index</div>
          <h1 style={{ fontFamily: "var(--font-serif)", fontSize: 31, fontWeight: 500, color: "var(--text)", lineHeight: 1.15, marginBottom: 8, textWrap: "balance" }}>
            What the search reads from — and where it's thin
          </h1>
          <p style={{ fontSize: 14.5, color: "var(--text-secondary)", maxWidth: "72ch", lineHeight: 1.6 }}>
            Read this before treating a search as a complete picture of the literature. It describes the whole collection behind the search box — its single source, its language and discipline skew, and how it's split by era. The coverage card on each result set tells you which of these limits hit <em>your</em> specific search.
          </p>
          <button onClick={goSearch} style={{ marginTop: 18, display: "inline-flex", alignItems: "center", gap: 7, padding: "8px 14px", border: "1px solid var(--border)", borderRadius: 8, background: "var(--bg-panel)", fontSize: 13, color: "var(--text-secondary)" }}>
            <Icon name="arrowLeft" size={14} /> Back to search
          </button>
        </header>

        <div style={{ padding: "28px 48px 56px", display: "flex", flexDirection: "column", gap: 28, maxWidth: 1180 }}>
          {/* Facts strip */}
          <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
            {facts.map(f => (
              <div key={f.label} style={{ flex: "1 1 200px", minWidth: 180, padding: "18px 22px", background: "var(--bg-panel)", border: "1px solid var(--border-light)", borderRadius: "var(--radius)", boxShadow: "var(--shadow-sm)" }}>
                <div style={{ fontSize: 11, fontWeight: 500, letterSpacing: "0.07em", textTransform: "uppercase", color: "var(--text-muted)", marginBottom: 7 }}>{f.label}</div>
                <div style={{ fontFamily: "var(--font-serif)", fontSize: 25, fontWeight: 500, color: "var(--text)", lineHeight: 1 }}>{f.value}</div>
                {f.sub && <div style={{ fontSize: 12, color: "var(--text-muted)", marginTop: 5 }}>{f.sub}</div>}
              </div>
            ))}
          </div>

          {/* Disclosures */}
          <div>
            <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: 16, marginBottom: 16, flexWrap: "wrap" }}>
              <h2 style={{ fontFamily: "var(--font-serif)", fontSize: 21, fontWeight: 500, color: "var(--text)" }}>Five things the collection won't tell you on its own</h2>
              <span style={{ fontSize: 12, color: "var(--text-muted)" }}>Ordered by how easily they distort a literature review</span>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              {DISCLOSURES.map((d, i) => <DisclosureCard key={d.id} d={d} n={i + 1} />)}
            </div>
          </div>

          {/* Distribution dashboard */}
          <div>
            <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: 16, marginBottom: 16, flexWrap: "wrap" }}>
              <h2 style={{ fontFamily: "var(--font-serif)", fontSize: 21, fontWeight: 500, color: "var(--text)" }}>The shape of the index</h2>
              <span style={{ fontSize: 12, color: "var(--text-muted)" }}>Approximate · section manifests, June 2026</span>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1.3fr 1fr", gap: 18 }} className="dist-grid">
              <Panel icon="route" title="By discipline" sub="How the router's buckets divide the corpus">
                <DisciplineBars />
              </Panel>
              <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
                <Panel icon="clock" title="By era" sub="Split at the 2010 boundary">
                  <StackBar rows={ERAS} />
                </Panel>
                <Panel icon="globe" title="By language" sub="Semantic matching applies to English only">
                  <LangBars />
                </Panel>
              </div>
            </div>
          </div>

          {/* Operator (de-emphasized) */}
          <OperatorSection metrics={metrics} />

          <p style={{ fontSize: 12, color: "var(--text-muted)", textAlign: "center", lineHeight: 1.6 }}>
            This page is linked from the <strong style={{ color: "var(--text-secondary)" }}>coverage card</strong> shown at the top of every result set.
          </p>
        </div>
      </main>
      <style>{`
        @media (max-width: 1024px) {
          .dist-grid { grid-template-columns: 1fr !important; }
          .op-grid { grid-template-columns: repeat(2, 1fr) !important; }
          .disc-grid { grid-template-columns: 1fr !important; }
        }
      `}</style>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
