# Gitleaks configuration for ClaudeBox projects
# https://github.com/gitleaks/gitleaks
#
# This file is copied into new projects at creation time.
# Customize per-project by editing .gitleaks.toml in the project root.

title = "ClaudeBox Gitleaks Config"

# ============================================
# Custom Rules — PII & Hardcoded Path Detection
# ============================================

[[rules]]
  id = "hardcoded-windows-user-path"
  description = "Hardcoded Windows user profile path (e.g. C:\\Users\\username\\)"
  regex = '''[Cc]:[/\\]+Users[/\\]+[A-Za-z0-9._-]+[/\\]'''
  tags = ["pii", "path", "windows"]

  [rules.allowlist]
    regexes = [
      '''<USERPROFILE>''',
      '''\$\{?USERPROFILE\}?''',
      '''\$env:USERPROFILE''',
      '''%USERPROFILE%''',
    ]

[[rules]]
  id = "personal-email-blocklist"
  description = "Known personal email addresses that should not appear in code"
  regex = '''(gzisboss@gmail\.com|gcchan888999@gmail\.com)'''
  tags = ["pii", "email"]

[allowlist]
  description = "Global allowlist for ClaudeBox projects"

  # Paths that should never be scanned
  paths = [
    '''\.env\.example''',
    '''\.env\.template''',
    '''\.gitattributes''',
    '''node_modules/.*''',
    '''dist/.*''',
    '''build/.*''',
    '''__pycache__/.*''',
    '''\.git/.*''',
    '''vendor/.*''',
    '''venv/.*''',
    '''\.next/.*''',
    '''tests/fixtures/.*''',
    '''test/fixtures/.*''',
  ]

  # Regex patterns to ignore (false positives)
  regexes = [
    '''EXAMPLE_''',
    '''YOUR_.*_HERE''',
    '''placeholder''',
    '''xxx+''',
  ]
