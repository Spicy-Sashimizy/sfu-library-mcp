<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 340px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        margin: 0;
        padding: 12px;
        color: #333;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 15px;
        color: #1a73e8;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        padding: 8px;
        border-radius: 6px;
        background: #f5f5f5;
      }
      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .status-dot.connected { background: #4caf50; }
      .status-dot.disconnected { background: #f44336; }
      .controls {
        margin-bottom: 12px;
      }
      .toggle-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 0;
      }
      .toggle {
        position: relative;
        width: 40px;
        height: 22px;
      }
      .toggle input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .toggle-slider {
        position: absolute;
        cursor: pointer;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #ccc;
        border-radius: 22px;
        transition: 0.2s;
      }
      .toggle-slider:before {
        content: "";
        position: absolute;
        height: 16px;
        width: 16px;
        left: 3px;
        bottom: 3px;
        background: white;
        border-radius: 50%;
        transition: 0.2s;
      }
      .toggle input:checked + .toggle-slider {
        background: #4caf50;
      }
      .toggle input:checked + .toggle-slider:before {
        transform: translateX(18px);
      }
      .manual-capture {
        margin-bottom: 12px;
      }
      .manual-capture input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 12px;
        margin-bottom: 6px;
      }
      .manual-capture button {
        width: 100%;
        padding: 6px;
        background: #1a73e8;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
      }
      .manual-capture button:hover {
        background: #1557b0;
      }
      .history {
        max-height: 200px;
        overflow-y: auto;
      }
      .history h3 {
        font-size: 12px;
        margin: 0 0 6px;
        color: #666;
      }
      .history-item {
        padding: 4px 0;
        border-bottom: 1px solid #eee;
        font-size: 11px;
      }
      .history-item .url {
        word-break: break-all;
        color: #555;
      }
      .history-item .meta {
        color: #999;
        font-size: 10px;
      }
      .history-item.success .meta { color: #4caf50; }
      .history-item.error .meta { color: #f44336; }
    </style>
  </head>
  <body>
    <h2>SFU Library PDF Capture</h2>

    <div class="status" id="status">
      <div class="status-dot disconnected" id="status-dot"></div>
      <span id="status-text">Checking server...</span>
    </div>

    <div class="controls">
      <div class="toggle-row">
        <span>Auto-capture PDFs</span>
        <label class="toggle">
          <input type="checkbox" id="auto-capture" checked />
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <div class="manual-capture">
      <input type="text" id="manual-url" placeholder="Paste PDF URL to capture..." />
      <button id="manual-btn">Capture URL</button>
    </div>

    <div class="history">
      <h3>Recent Captures</h3>
      <div id="history-list"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
