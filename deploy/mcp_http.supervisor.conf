# Persistent SFU Library MCP server (Streamable HTTP transport).
#
# Keeps ONE long-lived server so the heavy ML models (embedding v5,
# cross-encoder v1, SPLADE ONNX) load once and stay warm across Claude
# Desktop reconnects — eliminating the per-connect cold-start that made
# the stdio transport appear to hang on the first reranked search.
#
# Bound to 127.0.0.1: reached locally via the in-container `mcp-remote`
# bridge (docker exec). Remote/off-network access is layered on top via a
# reverse proxy, not by widening this bind.
#
# Install:  sudo cp deploy/mcp_http.supervisor.conf /etc/supervisor/conf.d/mcp-http.conf
#           sudo supervisorctl reread && sudo supervisorctl update
[program:mcp-http]
command=/workspaces/sfu-library-mcp-training/.venv/bin/python /workspaces/sfu-library-mcp-training/src/sfu_library_mcp_http.py
directory=/workspaces/sfu-library-mcp-training/src
environment=MCP_HTTP_HOST="127.0.0.1",MCP_HTTP_PORT="8080",SFU_METRICS_LOG_PATH="/workspaces/sfu-library-mcp-training/logs/mcp_metrics.jsonl",OPENALEX_TRACKER_PATH="/workspaces/sfu-library-mcp-training/data/openalex_calls.json"
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=20
stopsignal=TERM
stdout_logfile=/workspaces/sfu-library-mcp-training/logs/mcp_http.out.log
stderr_logfile=/workspaces/sfu-library-mcp-training/logs/mcp_http.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
