# Data-server for the DO offload build. Basic-auth on everything (HTTPS at NPM).
#  • /snapshots /models /code : READ-ONLY (GET/HEAD) — the droplet fetches inputs.
#  • /upload                  : PUT-ONLY WebDAV — the droplet pushes the finished
#                               OpenSearch snapshot back (reverse direction, same proxy).
server {
    listen 80 default_server;
    server_name _;
    charset utf-8;

    auth_basic           "sfu-offload";
    auth_basic_user_file /etc/nginx/.htpasswd;

    sendfile on; tcp_nopush on;
    client_max_body_size 0;                         # snapshot segment files can be large
    client_body_temp_path /srv/upload/.uploadtmp;   # same fs as dav root -> atomic rename, no container-temp pressure

    # read-only inputs
    location /snapshots/ { alias /srv/snapshots/; autoindex on; autoindex_exact_size off; limit_except GET HEAD { deny all; } }
    location /models/    { alias /srv/models/;    autoindex on; autoindex_exact_size off; limit_except GET HEAD { deny all; } }
    location /code/      { alias /srv/code/;      autoindex on; autoindex_exact_size off; limit_except GET HEAD { deny all; } }

    # write-back: PUT-only (no DELETE/MOVE/COPY). create_full_put_path makes parent dirs.
    location /upload/ {
        alias /srv/upload/;
        dav_methods PUT;
        create_full_put_path on;
        dav_access user:rw group:rw all:r;
        limit_except PUT { deny all; }
    }

    location = /healthz { auth_basic off; return 200 "ok\n"; }
    location = / { return 204; }
}
