# Read-only file server for the DO offload build. Basic-auth on everything.
# Autoindex lets the droplet's `wget -r` mirror the snapshot + model directories.
# GET/HEAD only — no upload path exists here (the index goes OUT via Spaces, not back through this).
server {
    listen 80 default_server;
    server_name _;
    charset utf-8;

    auth_basic           "sfu-offload";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # only safe, read-only methods
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    sendfile on; tcp_nopush on;

    location /snapshots/ { alias /srv/snapshots/; autoindex on; autoindex_exact_size off; }
    location /models/    { alias /srv/models/;    autoindex on; autoindex_exact_size off; }
    location /code/      { alias /srv/code/;       autoindex on; autoindex_exact_size off; }

    location = /healthz { auth_basic off; return 200 "ok\n"; }
    location = / { return 204; }
}
