; Auto-resume the local SPLADE reindex across container restarts + crashes.
; Install: sudo cp deploy/reindex_autoresume.supervisor.conf /etc/supervisor/conf.d/sfu-reindex-autoresume.conf
;          sudo supervisorctl reread && sudo supervisorctl update
[program:sfu-reindex-autoresume]
command=/bin/bash /workspaces/sfu-library-mcp-training/scripts/reindex_autoresume.sh
directory=/workspaces/sfu-library-mcp-training
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=5
startretries=9999
user=vscode
environment=HOME="/home/vscode",USER="vscode"
stdout_logfile=/workspaces/sfu-library-mcp-training/logs/reindex_autoresume.log
stderr_logfile=/workspaces/sfu-library-mcp-training/logs/reindex_autoresume.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
