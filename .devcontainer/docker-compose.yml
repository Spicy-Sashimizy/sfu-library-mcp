# ClaudeBox Project: sfu-library-thinclient (training branch of sfu-library-mcp)
name: claudebox-sfu-library-thinclient

services:
  app:
    container_name: claudebox-sfu-library-thinclient-app
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/sfu-library-thinclient:cached
      - claude-config:/home/vscode/.claude:cached
      - pommel_data:/home/vscode/.pommel-data:cached
      - gh-cli-config:/home/vscode/.config/gh:cached
      - ${USERPROFILE}/.claudebox/mcp-servers/pommel/devcontainer-server.py:/usr/local/bin/pommel-mcp-server.py:ro
      - ${USERPROFILE}/.claudebox/mcp-servers/lsp/lsp-mcp-server.py:/usr/local/bin/lsp-mcp-server.py:ro
      - ${USERPROFILE}/.ssh:/home/vscode/.ssh
      - ./entrypoint.sh:/usr/local/bin/claudebox-entrypoint.sh:ro
      - ${USERPROFILE}/.claudebox/git-credentials/.git-credentials:/mnt/claudebox-git-creds/.git-credentials:ro
      - claude-local:/home/vscode/.local:cached
      - ${USERPROFILE}/.claudebox/credentials.json:/home/vscode/.claudebox-credentials/credentials.json:ro
      - ${USERPROFILE}/Downloads:/mnt/host-downloads
      - ${USERPROFILE}/AppData/Roaming/Claude/logs:/mnt/claude-desktop-logs:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/claudebox-entrypoint.sh"]
    command: sleep infinity
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-dev}:${DB_PASSWORD:-dev}@postgres:5432/${DB_NAME:-app_dev}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-dev}@redis:6379/0
      # Thin-client stack (tantivy+BMP+usearch) is the serving backend — no
      # local OpenSearch. Eval baselines reach the ORIGINAL container's
      # cluster (read-only) via the host gateway.
      - SFU_SEARCH_BACKEND=thinclient
      - SFU_OPENSEARCH_URL=http://host.docker.internal:9200
      - PYTHONPATH=/workspaces/sfu-library-thinclient
      - CLAUDE_CONFIG_DIR=/home/vscode/.claude
      - CLAUDE_BACKEND=${CLAUDE_BACKEND:-anthropic}
      - CLAUDEBOX_CREDENTIALS_FILE=/home/vscode/.claudebox-credentials/credentials.json
      - OLLAMA_HOST=http://host.docker.internal:11434
      - POMMEL_DATA_DIR=/home/vscode/.pommel-data
      - PROJECT_NAME=sfu-library-thinclient
      - POMMEL_HOST=claudebox-sfu-library-thinclient-pommel
      - POMMEL_PORT=7420
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    networks:
      - claudebox-sfu-library-thinclient-net
      - claudebox-shared
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "com.claudebox.project=sfu-library-thinclient"
      - "com.claudebox.service=app"
      - "com.claudebox.managed=true"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  cloudflared:
    container_name: claudebox-sfu-library-thinclient-tunnel
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    env_file:
      - .cloudflared.env
    command: ["tunnel", "--no-autoupdate", "run", "--protocol", "http2"]
    depends_on:
      - app
    networks:
      - claudebox-sfu-library-thinclient-net
    labels:
      - "com.claudebox.project=sfu-library-thinclient"
      - "com.claudebox.service=tunnel"
      - "com.claudebox.managed=true"
    profiles:
      - tunnel

  postgres:
    container_name: claudebox-sfu-library-thinclient-db
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev}
      POSTGRES_DB: ${DB_NAME:-app_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - claudebox-sfu-library-thinclient-net
    labels:
      - "com.claudebox.project=sfu-library-thinclient"
      - "com.claudebox.service=database"
      - "com.claudebox.managed=true"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dev} -d ${DB_NAME:-app_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # OpenSearch service REMOVED (2026-06-11): this testbed runs the thin-client
  # stack. Host-side cleanup once the container is recreated:
  #   docker rm -f claudebox-sfu-library-thinclient-opensearch
  #   docker volume rm claudebox-sfu-library-thinclient-opensearch
  # (The 150M-doc cluster in the ORIGINAL sfu-library-mcp container is untouched.)

  redis:
    container_name: claudebox-sfu-library-thinclient-redis
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-dev}"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - claudebox-sfu-library-thinclient-net
    labels:
      - "com.claudebox.project=sfu-library-thinclient"
      - "com.claudebox.service=cache"
      - "com.claudebox.managed=true"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  claudebox-sfu-library-thinclient-net:
    name: claudebox-sfu-library-thinclient-net
    driver: bridge
    labels:
      - "com.claudebox.project=sfu-library-thinclient"
      - "com.claudebox.managed=true"
  claudebox-shared:
    external: true
    name: claudebox-shared-net

volumes:
  postgres_data:
    name: claudebox-sfu-library-thinclient-postgres
    labels:
      com.claudebox.project: sfu-library-thinclient
      com.claudebox.managed: "true"
  redis_data:
    name: claudebox-sfu-library-thinclient-redis
    labels:
      com.claudebox.project: sfu-library-thinclient
      com.claudebox.managed: "true"
  pommel_data:
    name: claudebox-sfu-library-thinclient-pommel
    labels:
      com.claudebox.project: sfu-library-thinclient
      com.claudebox.managed: "true"
  gh-cli-config:
    name: claudebox-sfu-library-thinclient-gh-cli
    labels:
      com.claudebox.project: sfu-library-thinclient
      com.claudebox.managed: "true"
  claude-config:
    name: claudebox-shared-config
    external: true
  claude-local:
    name: claudebox-sfu-library-thinclient-local
    labels:
      com.claudebox.project: sfu-library-thinclient
      com.claudebox.managed: "true"
