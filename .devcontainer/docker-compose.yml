# ClaudeBox Project: sfu-library-mcp
name: claudebox-sfu-library-mcp

services:
  app:
    container_name: claudebox-sfu-library-mcp-app
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/sfu-library-mcp:cached
      - claude-config:/home/vscode/.claude:cached
      - pommel_data:/home/vscode/.pommel-data:cached
      - gh-cli-config:/home/vscode/.config/gh:cached
      - ${CLAUDEBOX_ROOT}/mcp-servers/pommel/devcontainer-server.py:/usr/local/bin/pommel-mcp-server.py:ro
      - ${USERPROFILE}/.ssh:/home/vscode/.ssh
      - ./entrypoint.sh:/usr/local/bin/claudebox-entrypoint.sh:ro
      - ${USERPROFILE}/.claudebox/git-credentials/.git-credentials:/mnt/claudebox-git-creds/.git-credentials:ro
      - claude-local:/home/vscode/.local:cached
      - C:/Users/gordo/.claudebox/credentials.json:/home/vscode/.claudebox-credentials/credentials.json:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/claudebox-entrypoint.sh"]
    command: sleep infinity
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql://dev:dev@postgres:5432/app_dev
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/workspaces/sfu-library-mcp
      - CLAUDE_CONFIG_DIR=/home/vscode/.claude
      - CLAUDE_BACKEND=${CLAUDE_BACKEND:-anthropic}
      - CLAUDEBOX_CREDENTIALS_FILE=/home/vscode/.claudebox-credentials/credentials.json
    networks:
      - claudebox-sfu-library-mcp-net
    labels:
      - "com.claudebox.project=sfu-library-mcp"
      - "com.claudebox.service=app"
      - "com.claudebox.managed=true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  cloudflared:
    container_name: claudebox-sfu-library-mcp-tunnel
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    env_file:
      - .cloudflared.env
    command: ["tunnel", "--no-autoupdate", "run", "--protocol", "http2"]
    depends_on:
      - app
    networks:
      - claudebox-sfu-library-mcp-net
    labels:
      - "com.claudebox.project=sfu-library-mcp"
      - "com.claudebox.service=tunnel"
      - "com.claudebox.managed=true"
    profiles:
      - tunnel

  postgres:
    container_name: claudebox-sfu-library-mcp-db
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: app_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - claudebox-sfu-library-mcp-net
    labels:
      - "com.claudebox.project=sfu-library-mcp"
      - "com.claudebox.service=database"
      - "com.claudebox.managed=true"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d app_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: claudebox-sfu-library-mcp-redis
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - claudebox-sfu-library-mcp-net
    labels:
      - "com.claudebox.project=sfu-library-mcp"
      - "com.claudebox.service=cache"
      - "com.claudebox.managed=true"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  claudebox-sfu-library-mcp-net:
    name: claudebox-sfu-library-mcp-net
    driver: bridge
    labels:
      - "com.claudebox.project=sfu-library-mcp"
      - "com.claudebox.managed=true"

volumes:
  postgres_data:
    name: claudebox-sfu-library-mcp-postgres
    labels:
      com.claudebox.project: sfu-library-mcp
      com.claudebox.managed: "true"
  redis_data:
    name: claudebox-sfu-library-mcp-redis
    labels:
      com.claudebox.project: sfu-library-mcp
      com.claudebox.managed: "true"
  claude-config:
    name: claudebox-shared-config
    labels:
      com.claudebox.managed: "true"
  claude-local:
    name: claudebox-${PROJECT_NAME}-local
    labels:
      com.claudebox.project: ${PROJECT_NAME}
      com.claudebox.managed: "true"


