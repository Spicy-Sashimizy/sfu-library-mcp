# ClaudeBox Project: ${PROJECT_NAME}
name: claudebox-${PROJECT_NAME}

services:
  app:
    container_name: claudebox-${PROJECT_NAME}-app
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/${PROJECT_NAME}:cached
      - claude-config:/home/vscode/.claude:cached
      - pommel_data:/home/vscode/.pommel-data:cached
      - gh-cli-config:/home/vscode/.config/gh:cached
      - claude-local:/home/vscode/.local:cached
      - ${CLAUDEBOX_ROOT}/mcp-servers/pommel/devcontainer-server.py:/usr/local/bin/pommel-mcp-server.py:ro
      # SSH keys for Git operations (GitHub authentication)
      # Mounted writable to allow permission fixes in entrypoint.sh
      - ${USERPROFILE}/.ssh:/home/vscode/.ssh
      # Entrypoint script for persistent SSH/Git setup
      - ./entrypoint.sh:/usr/local/bin/claudebox-entrypoint.sh:ro
      # Git credentials for HTTPS authentication (OAuth token)
      - ${USERPROFILE}/.claudebox/git-credentials/.git-credentials:/mnt/claudebox-git-creds/.git-credentials:ro
      # Public branch generator scripts (portfolio README generation)
      - ${CLAUDEBOX_ROOT}/scripts/generate-public-branch.sh:/usr/local/bin/generate-public-branch.sh:ro
      - ${CLAUDEBOX_ROOT}/scripts/public-branch-helper.py:/usr/local/bin/public-branch-helper.py:ro
      - ${CLAUDEBOX_ROOT}/scripts/public-branch-prompts.sh:/usr/local/bin/public-branch-prompts.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/claudebox-entrypoint.sh"]
    command: ["sleep", "infinity"]
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-dev}:${DB_PASSWORD:-dev}@postgres:5432/${DB_NAME:-app_dev}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-dev}@redis:6379/0
      - PYTHONPATH=/workspaces/${PROJECT_NAME}
      - CLAUDE_CONFIG_DIR=/home/vscode/.claude
      - OLLAMA_HOST=http://host.docker.internal:11434
      - POMMEL_DATA_DIR=/home/vscode/.pommel-data
      - CLAUDE_BACKEND=${CLAUDE_BACKEND:-anthropic}
      - CLAUDEBOX_CREDENTIALS_FILE=/home/vscode/.claudebox-credentials/credentials.json
      - PROJECT_NAME=${PROJECT_NAME}
      - POMMEL_HOST=claudebox-${PROJECT_NAME}-pommel
      - POMMEL_PORT=7420
    networks:
      - ${PROJECT_NETWORK}
      - claudebox-shared
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "com.claudebox.project=${PROJECT_NAME}"
      - "com.claudebox.service=app"
      - "com.claudebox.managed=true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  cloudflared:
    container_name: claudebox-${PROJECT_NAME}-tunnel
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    env_file:
      - .cloudflared.env
    command: ["tunnel", "--no-autoupdate", "run", "--protocol", "http2"]
    depends_on:
      - app
    networks:
      - ${PROJECT_NETWORK}
    labels:
      - "com.claudebox.project=${PROJECT_NAME}"
      - "com.claudebox.service=tunnel"
      - "com.claudebox.managed=true"
    profiles:
      - tunnel

  postgres:
    container_name: claudebox-${PROJECT_NAME}-db
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev}
      POSTGRES_DB: ${DB_NAME:-app_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ${PROJECT_NETWORK}
    labels:
      - "com.claudebox.project=${PROJECT_NAME}"
      - "com.claudebox.service=database"
      - "com.claudebox.managed=true"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dev} -d ${DB_NAME:-app_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: claudebox-${PROJECT_NAME}-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-dev}"]
    volumes:
      - redis_data:/data
    networks:
      - ${PROJECT_NETWORK}
    labels:
      - "com.claudebox.project=${PROJECT_NAME}"
      - "com.claudebox.service=cache"
      - "com.claudebox.managed=true"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  ${PROJECT_NETWORK}:
    name: claudebox-${PROJECT_NAME}-net
    driver: bridge
    labels:
      - "com.claudebox.project=${PROJECT_NAME}"
      - "com.claudebox.managed=true"

  claudebox-shared:
    external: true
    name: claudebox-shared-net

volumes:
  postgres_data:
    name: claudebox-${PROJECT_NAME}-postgres
    labels:
      com.claudebox.project: ${PROJECT_NAME}
      com.claudebox.managed: "true"
  redis_data:
    name: claudebox-${PROJECT_NAME}-redis
    labels:
      com.claudebox.project: ${PROJECT_NAME}
      com.claudebox.managed: "true"

  pommel_data:
    name: claudebox-${PROJECT_NAME}-pommel
    labels:
      com.claudebox.project: ${PROJECT_NAME}
      com.claudebox.managed: "true"

  claude-config:
    name: claudebox-shared-config
    labels:
      com.claudebox.managed: "true"

  gh-cli-config:
    name: claudebox-${PROJECT_NAME}-gh-cli
    labels:
      com.claudebox.project: ${PROJECT_NAME}
      com.claudebox.managed: "true"

  claude-local:
    name: claudebox-${PROJECT_NAME}-local
    labels:
      com.claudebox.project: ${PROJECT_NAME}
      com.claudebox.managed: "true"
