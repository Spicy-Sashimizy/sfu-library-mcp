[supervisord]
nodaemon=false
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:ollama-proxy]
command=socat TCP-LISTEN:11434,fork,reuseaddr TCP:host.docker.internal:11434
user=vscode
autostart=true
autorestart=true
startsecs=2
startretries=10
redirect_stderr=true
stdout_logfile=/var/log/supervisor/ollama-proxy.log
stdout_logfile_maxbytes=10MB
priority=10

[program:pommeld]
command=/bin/bash -c "sleep 5 && cd /workspaces/%(ENV_PROJECT_NAME)s && /usr/local/bin/pommeld -project /workspaces/%(ENV_PROJECT_NAME)s"
user=vscode
autostart=true
autorestart=true
startsecs=10
startretries=5
redirect_stderr=true
stdout_logfile=/var/log/supervisor/pommeld.log
stdout_logfile_maxbytes=10MB
priority=20
environment=HOME="/home/vscode",USER="vscode"

[program:pommel-agent]
command=/bin/bash -c "sleep 30 && cd /workspaces/%(ENV_PROJECT_NAME)s && python3 /home/vscode/.claudebox/pommel/agent.py"
user=vscode
autostart=true
autorestart=true
startsecs=15
startretries=3
redirect_stderr=true
stdout_logfile=/var/log/supervisor/pommel-agent.log
stdout_logfile_maxbytes=10MB
priority=30
environment=HOME="/home/vscode",USER="vscode",PROJECT_NAME="%(ENV_PROJECT_NAME)s",POMMEL_AGENT_INTERVAL="60"
