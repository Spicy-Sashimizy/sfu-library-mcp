[supervisord]
nodaemon=false
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0777

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf

[program:ollama-proxy]
command=socat -T30 TCP-LISTEN:11434,fork,reuseaddr,keepalive,keepidle=30,keepintvl=10,keepcnt=3 TCP:host.docker.internal:11434,connect-timeout=10,keepalive,keepidle=30,keepintvl=10,keepcnt=3
autostart=true
autorestart=true
startsecs=2
startretries=10
redirect_stderr=true
stdout_logfile=/var/log/supervisor/ollama-proxy.log
stdout_logfile_maxbytes=10MB
priority=10

[program:pommeld]
command=/bin/bash -c "sleep 5 && if [ ! -x /usr/local/bin/pommeld ]; then echo '[pommeld] not installed, skipping'; exit 0; fi && cd /workspaces/%(ENV_PROJECT_NAME)s && /usr/local/bin/pommeld -project /workspaces/%(ENV_PROJECT_NAME)s"
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0
startretries=5
redirect_stderr=true
stdout_logfile=/var/log/supervisor/pommeld.log
stdout_logfile_maxbytes=10MB
priority=20
environment=HOME="/home/vscode",USER="vscode"

[program:pommel-agent]
command=/bin/bash -c "sleep 30 && if [ ! -f /home/vscode/.claudebox/pommel/agent.py ]; then echo '[pommel-agent] agent.py not found, skipping'; exit 0; fi && cd /workspaces/%(ENV_PROJECT_NAME)s && python3 /home/vscode/.claudebox/pommel/agent.py"
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0
startretries=3
redirect_stderr=true
stdout_logfile=/var/log/supervisor/pommel-agent.log
stdout_logfile_maxbytes=10MB
priority=30
environment=HOME="/home/vscode",USER="vscode",PROJECT_NAME="%(ENV_PROJECT_NAME)s",POMMEL_AGENT_INTERVAL="60"

[program:lsp-healthcheck]
command=/bin/bash -c "sleep 60 && /usr/local/bin/lsp-healthcheck.sh"
autostart=true
autorestart=true
startsecs=30
startretries=3
redirect_stderr=true
stdout_logfile=/var/log/supervisor/lsp-healthcheck.log
stdout_logfile_maxbytes=5MB
priority=40
environment=HOME="/home/vscode",USER="vscode",PROJECT_NAME="%(ENV_PROJECT_NAME)s",LSP_HEALTHCHECK_INTERVAL="300"

[program:lsp-symbol-bridge]
command=/bin/bash -c "sleep 90 && /usr/local/bin/lsp-symbol-bridge.sh"
autostart=true
autorestart=true
startsecs=30
startretries=3
redirect_stderr=true
stdout_logfile=/var/log/supervisor/lsp-symbol-bridge.log
stdout_logfile_maxbytes=5MB
priority=50
environment=HOME="/home/vscode",USER="vscode",PROJECT_NAME="%(ENV_PROJECT_NAME)s",SYMBOL_BRIDGE_INTERVAL="300"

[program:ollama-healthcheck]
command=/bin/bash -c "sleep 30 && /usr/local/bin/ollama-healthcheck.sh"
autostart=true
autorestart=true
startsecs=15
startretries=3
redirect_stderr=true
stdout_logfile=/var/log/supervisor/ollama-healthcheck.log
stdout_logfile_maxbytes=5MB
priority=45
environment=HOME="/home/vscode",USER="vscode",PROJECT_NAME="%(ENV_PROJECT_NAME)s",OLLAMA_HEALTHCHECK_INTERVAL="120"
