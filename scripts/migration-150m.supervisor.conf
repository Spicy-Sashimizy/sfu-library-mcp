[program:migration-150m]
command=/workspaces/sfu-library-thinclient/.venv/bin/python3 scripts/build_thinclient_index.py --persona political_science --slices 8 --workers 4 --build-workers 3 --bmp-shard-docs 1000000 --index-root data/thinclient_index
directory=/workspaces/sfu-library-thinclient
user=vscode
environment=SFU_MIGRATION_SOURCE="http://host.docker.internal:9200",HOME="/home/vscode"
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=30
startretries=10
stopwaitsecs=60
stdout_logfile=/workspaces/sfu-library-thinclient/logs/migration_150m.log
stdout_logfile_maxbytes=50MB
redirect_stderr=true
