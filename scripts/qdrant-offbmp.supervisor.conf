# Off-BMP migration (Qdrant on_disk sparse) — supervisord programs.
# Phase gate: 30M resumable ingest from spool_backup, then parity measure.
# Install: sudo cp scripts/qdrant-offbmp.supervisor.conf /etc/supervisor/conf.d/
#          sudo supervisorctl reread && sudo supervisorctl update
# Status:  sudo supervisorctl status qdrant-spike qdrant-ingest-30m

[program:qdrant-spike]
command=/workspaces/sfu-library-thinclient/.tools/qdrant/qdrant
directory=/workspaces/sfu-library-thinclient/data/qdrant_spike
environment=QDRANT__STORAGE__STORAGE_PATH="/workspaces/sfu-library-thinclient/data/qdrant_spike/storage",HOME="/home/vscode"
user=vscode
autostart=true
autorestart=true
startsecs=10
startretries=10
stopwaitsecs=60
stdout_logfile=/workspaces/sfu-library-thinclient/logs/qdrant_offbmp.log
stdout_logfile_maxbytes=50MB
redirect_stderr=true
stopasgroup=true
killasgroup=true

# Resumable ingest: 30M-doc parity gate. _wait_qdrant() blocks until the server
# above is reachable, so start ordering is not load-bearing. Re-running after a
# clean finish is a fast no-op (all worker checkpoints are complete).
#
# Full ~150M off-BMP ingest into splade_150m (the collection the retriever gate
# SFU_SPLADE_QDRANT_COLLECTION defaults to). --n 250M >> 150.4M total so no worker
# caps before exhausting its slice stripe. ~9.8h at the measured 4,234 docs/s;
# resumable across restarts via per-worker checkpoints. The 30M gate (splade_par30)
# is left in place as the validation artifact / retriever test target.
[program:qdrant-ingest-150m]
command=/workspaces/sfu-library-thinclient/.venv/bin/python3 scripts/spike_qdrant_sparse.py build-spool-par --n 250000000 --collection splade_150m --workers 8 --batch 1000 --segments 24 --opt-threads 8
directory=/workspaces/sfu-library-thinclient
environment=HOME="/home/vscode"
user=vscode
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=30
startretries=10
stopwaitsecs=120
stdout_logfile=/workspaces/sfu-library-thinclient/logs/qdrant_ingest_150m.log
stdout_logfile_maxbytes=200MB
redirect_stderr=true
stopasgroup=true
killasgroup=true
